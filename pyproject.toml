[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "valheim-skill-editor"
version = "1.0.0"
description = "Редактор навыков персонажей Valheim (.fch)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
valheim-skill-editor = "valheim_skills.gui:main"

[project.scripts]
valheim-skill-editor-cli = "valheim_skills.cli:run"

[tool.setuptools.packages.find]
include = ["valheim_skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
